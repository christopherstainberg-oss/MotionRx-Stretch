# MotionRx Stretch stack for Docker / Portainer
# Images are hosted on ghcr.io (GitHub Container Registry).
#
# Example:
#   GHCR_IO_IMAGE=ghcr.io/christopherstainberg-oss/motionrx-stretch:latest
#
# Pull & run:
#   docker compose pull && docker compose up -d

services:
  motionrx:
    image: ${GHCR_IO_IMAGE:-ghcr.io/christopherstainberg-oss/motionrx-stretch:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motionrx-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      # Generate a strong secret: openssl rand -base64 32
      - AUTH_SECRET=${AUTH_SECRET:-dev-only-change-me-use-openssl-rand}
      - DATA_DIR=/app/data
      - PORT=3000
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_MODEL=${XAI_MODEL:-grok-4-1-fast-non-reasoning}
    volumes:
      - motionrx-data:/app/data
    networks:
      - motionrx-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.motionrx.description=MotionRx Stretch Physical Therapy PWA"
      - "com.motionrx.registry=ghcr.io"

  # Automatic container updates from ghcr.io
  watchtower:
    image: containrrr/watchtower:latest
    container_name: motionrx-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-3600}
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      # Prefer ghcr.io registry pulls
      - REPO_USER=${GHCR_IO_USER:-}
      - REPO_PASS=${GHCR_IO_TOKEN:-}
    networks:
      - motionrx-net
    depends_on:
      - motionrx

networks:
  motionrx-net:
    driver: bridge

volumes:
  motionrx-data:
    name: motionrx-data
